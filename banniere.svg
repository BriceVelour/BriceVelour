<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="YANNICK BRICE · Le dirigeant de BriceVelour · Développeur en formation : web, mobile, marchés et IA">
<defs><clipPath id="c"><path d="M0 0 H858 L880 22 V300 H0 Z"/></clipPath>
<radialGradient id="l" cx="30%" cy="0%" r="70%"><stop offset="0" stop-color="#ecebff" stop-opacity=".06"/><stop offset="1" stop-color="#ecebff" stop-opacity="0"/></radialGradient>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecebff" stop-opacity="0"/><stop offset=".5" stop-color="#ecebff" stop-opacity=".07"/><stop offset="1" stop-color="#ecebff" stop-opacity="0"/></linearGradient></defs>
<style>
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateY(-20px);opacity:0}6%{opacity:1}40%{transform:translateY(var(--bas));opacity:0}100%{transform:translateY(var(--bas));opacity:0}}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.6s cubic-bezier(.5,0,.2,1) forwards}
.o{opacity:0;animation:monte .9s ease-out forwards}
.b{animation:bat 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w,.o,.b,.sc,.r{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}.sc{opacity:0}}
.k{font:500 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.nm{font:600 30px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.42em;fill:#ecebff}
.ss{font:500 10px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.28em;fill:#8f8da8}
.et{font:500 10px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.28em;fill:#ecebff}
.ph{font:italic 400 17px 'Source Serif 4',Georgia,'Times New Roman',serif;fill:#b9b7d0}
.v{font:600 34px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;fill:#ecebff}
.vs{font:400 12px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.06em;fill:#8f8da8}
.og{font:600 10px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#ecebff}
.om{font:500 10px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.r{animation:remplit 2s ease-out 1.4s forwards;transform:scaleX(0);transform-origin:590px 0}
@keyframes remplit{to{transform:scaleX(1)}}
.sc{--bas:320px;animation:scan 9s ease-in-out 2.4s infinite;opacity:0}
.u{animation:trace 1.2s ease-out 2.2s forwards;stroke-dasharray:1;stroke-dashoffset:1}
</style>
<g clip-path="url(#c)"><rect width="880" height="300" fill="#04050a"/><rect width="880" height="300" fill="url(#l)"/>
<rect class="sc" x="0" y="0" width="880" height="60" fill="url(#s)"/></g>
<path d="M0.5 0.5 H857.5 L879.5 22.5 V299.5 H0.5 Z" fill="none" stroke="#ecebff" stroke-opacity=".28"/>
<path class="w" pathLength="1" d="M0.5 0.5 H857.5 L879.5 22.5 V299.5 H0.5 Z" fill="none" stroke="#ecebff" stroke-opacity=".55" style="animation-duration:2.6s"/>
<text x="36" y="44" class="k o" style="animation-delay:.1s">BRICEVELOUR · PROFIL D'OPÉRATEUR</text>
<text x="836" y="44" text-anchor="end" class="k o" style="animation-delay:.2s">QUÉBEC · CANADA</text>
<g class="o" style="animation-delay:.5s"><text x="36" y="122" class="nm">YANNICK BRICE</text></g>
<g class="o" style="animation-delay:.8s"><text x="38" y="148" class="ss">LE DIRIGEANT · BRICEVELOUR</text>
<circle class="b" cx="41" cy="167.5" r="3" fill="#00e6a0"/><text x="52" y="171" class="et">DERNIÈRE ACTIVITÉ · 26.10.2026</text></g>
<g class="o" style="animation-delay:1.1s"><text x="37" y="210" class="ph">Développeur en formation : web, mobile, marchés et IA.</text></g>
<g class="o" style="animation-delay:1s"><text x="590" y="96" class="k">NIVEAU</text>
<text x="590" y="134" class="v">5 / 6<tspan class="vs" dx="10">SESSIONS</tspan></text>
<rect x="590.5" y="146.5" width="254" height="5" fill="none" stroke="#ecebff" stroke-opacity=".5"/>
<rect class="r" x="590.5" y="146.5" width="212" height="5" fill="#ffc846"/>
<text x="590" y="171" class="ss">CÉGEP DE SOREL-TRACY · WEB3</text></g>
<line x1="36" y1="238.5" x2="844" y2="238.5" stroke="#ecebff" stroke-opacity=".14"/>
<g class="o" style="animation-delay:1.8s"><text x="36" y="266" class="og">01  REIZA</text><text x="266" y="266" class="om">02  VELOUR</text><text x="496" y="266" class="om">03  CÉGEP</text></g>
<path class="u" pathLength="1" d="M36 238.5 H112" stroke="#ecebff" stroke-width="2"/>
</svg>