<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="YANNICK BRICE · Développeur en formation : web, mobile, marchés et IA">
<defs><radialGradient id="g" cx="30%" cy="40%" r="60%"><stop offset="0" stop-color="#2a3fd8" stop-opacity=".38"/><stop offset="1" stop-color="#2a3fd8" stop-opacity="0"/></radialGradient></defs><style>
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes souffle{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes sel{0%{opacity:0}3%,22%{opacity:1}26%,100%{opacity:0}}
