.n{font:600 13px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.e{font:700 22px 'Source Serif 4',Georgia,'Times New Roman',serif;letter-spacing:.16em;fill:#ecebff}
.d{font:400 14px 'Source Serif 4',Georgia,'Times New Roman',serif;fill:#b9b7d0}
</style>
