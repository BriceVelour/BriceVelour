<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" role="img" aria-label="01 · REIZA · THE SYSTEM · Assistante IA personnelle : une voix, une mémoire, des routines.">
<defs><clipPath id="c"><path d="M0 0 H866 L880 14 V96 H0 Z"/></clipPath>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b6bff" stop-opacity="0"/><stop offset=".5" stop-color="#9b6bff" stop-opacity=".06"/><stop offset="1" stop-color="#9b6bff" stop-opacity="0"/></linearGradient></defs>
<style>
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateY(-20px);opacity:0}6%{opacity:1}40%{transform:translateY(var(--bas));opacity:0}100%{transform:translateY(var(--bas));opacity:0}}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.6s cubic-bezier(.5,0,.2,1) forwards}
.o{opacity:0;animation:monte .9s ease-out forwards}
.b{animation:bat 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w,.o,.b,.sc,.r{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}.sc{opacity:0}}
.u{font:500 11px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.2em;fill:#9b6bff}
.h{font:600 15px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.38em;fill:#ecebff}
.hs{font:500 10px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.d{font:italic 400 14.5px 'Source Serif 4',Georgia,'Times New Roman',serif;fill:#b9b7d0}
.a{font:600 9.5px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.24em;fill:#9b6bff}
.m{font:500 9.5px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.22em;fill:#8f8da8}
.bar{transform:scaleY(0);transform-origin:0 0;animation:pousse .8s ease-out 0.30s forwards}
@keyframes pousse{to{transform:scaleY(1)}}
.sc{--bas:116px;animation:scan 9s ease-in-out 3s infinite;opacity:0}
</style>
<g clip-path="url(#c)"><rect width="880" height="96" fill="#04050a"/><rect width="880" height="96" fill="#9b6bff" fill-opacity=".05"/>
<rect class="sc" x="0" y="0" width="880" height="26" fill="url(#s)"/>
<rect class="bar" x="0" y="0" width="4" height="96" fill="#9b6bff"/></g>
<path d="M0.5 0.5 H865.5 L879.5 14.5 V95.5 H0.5 Z" fill="none" stroke="#9b6bff" stroke-opacity=".3"/>
<path class="w" pathLength="1" d="M0.5 0.5 H865.5 L879.5 14.5 V95.5 H0.5 Z" fill="none" stroke="#9b6bff" stroke-opacity=".85" style="animation-delay:0.30s;animation-duration:1.8s"/>
<g class="o" style="animation-delay:0.30s"><text x="36" y="52" class="u">01</text><line x1="76.5" y1="30" x2="76.5" y2="66" stroke="#9b6bff" stroke-opacity=".35"/></g>
<g transform="translate(100 25) scale(.1)"><g fill="none" stroke="#9b6bff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path class="w" pathLength="1" d="M79 20 V222" style="animation-delay:0.3s"/><path class="w" pathLength="1" d="M79 42 L153 86 L79 130" style="animation-delay:0.6s"/><path class="w" pathLength="1" d="M79 130 L161 222" style="animation-delay:0.9s"/><path class="w" pathLength="1" d="M79 42 L121 16" style="animation-delay:1.2s"/></g></g>
<g class="o" style="animation-delay:0.55s"><text x="136" y="44" class="h">REIZA<tspan class="hs" dx="14">· THE SYSTEM</tspan></text>
<text x="100" y="70" class="d">Assistante IA personnelle : une voix, une mémoire, des routines.</text></g>
<g class="o" style="animation-delay:0.75s"><circle cx="792" cy="39.8" r="2.6" fill="none" stroke="#9b6bff" stroke-opacity="0.6"/><text x="844" y="43" text-anchor="end" class="a">PRIVÉ</text>
<text x="844" y="68" text-anchor="end" class="m">BÂTIE AVEC CLAUDE</text></g>
