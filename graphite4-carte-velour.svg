@keyframes vit{0%,100%{opacity:0}3%,30%{opacity:1}36%{opacity:0}}
.res{animation:res 10s ease-in-out infinite;animation-delay:-6s}
@keyframes res{0%,100%{opacity:.7}5%,30%{opacity:1}38%{opacity:.7}}
.logo{filter:drop-shadow(0 0 5px rgba(236,235,255,.35));animation:lg 10s ease-in-out infinite;animation-delay:-6s}
@keyframes lg{0%,100%{opacity:.85}5%,30%{opacity:1}38%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.lum,.res,.logo{animation:none}.lum{opacity:0}}
</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00e6a0"/><stop offset=".5" stop-color="#ecebff"/><stop offset="1" stop-color="#00e6a0"/></linearGradient><filter id="f" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="436" height="172" fill="#0e1013"/><path d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" fill="#15181d" stroke="#2a2e37"/><path class="lum" d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="7" filter="url(#f)" opacity=".8"/><path class="lum" d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="2.2"/><text x="26" y="42" fill="#00e6a0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="3" class="res">02</text><text x="26" y="90" fill="#eceaf2" font-family="'Source Serif 4',Georgia,serif" font-size="34" font-weight="600" letter-spacing="5">VELOUR</text><text x="26" y="122" fill="#a9a7b6" font-family="'Source Serif 4',Georgia,serif" font-size="19" font-style="italic">Étude des marchés, en privé.</text><text x="410" y="150" text-anchor="end" fill="#00e6a0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">PRIVÉ</text><g transform="translate(388 46)"><g class="logo"><g transform="scale(1.3)"><g transform="scale(.42) translate(-75 -55)"><polygon points="75,6 120,31 120,79 75,104 30,79 30,31" fill="none" stroke="#7aa2ff" stroke-width="4" stroke-linejoin="round"/><path d="M52 34 L75 80 L98 34" fill="none" stroke="#ecebff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 80 V96" stroke="#ecebff" stroke-width="6" stroke-linecap="round"/><circle cx="75" cy="22" r="5" fill="#3dff9a"/></g></g></g></g></svg>