<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 72" width="880" height="72" role="img" aria-label="Envie de discuter ? Écris-moi sur Discord">
<defs><clipPath id="c"><path d="M0 0 H864 L880 16 V72 H0 Z"/></clipPath>
<radialGradient id="g" cx="8%" cy="50%" r="40%"><stop offset="0" stop-color="#5865f2" stop-opacity=".35"/><stop offset="1" stop-color="#5865f2" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes souffle{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes va{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.6s cubic-bezier(.5,0,.2,1) 1.2s forwards}
.o{opacity:0;animation:monte .9s ease-out 1.4s forwards}
.s{animation:souffle 5s ease-in-out infinite}
.f{animation:va 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w,.o,.s,.f{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
.t{font:600 13px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.38em;fill:#ecebff}
.k{font:500 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
</style>
<g clip-path="url(#c)"><rect width="880" height="72" fill="#04050a"/><rect class="s" width="880" height="72" fill="url(#g)"/></g>
<path d="M0.5 0.5 H863.5 L879.5 16.5 V71.5 H0.5 Z" fill="none" stroke="#5865f2" stroke-opacity=".35"/>
<path class="w" pathLength="1" d="M0.5 0.5 H863.5 L879.5 16.5 V71.5 H0.5 Z" fill="none" stroke="#5865f2" stroke-opacity=".9"/>
