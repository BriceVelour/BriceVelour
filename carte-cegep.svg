<g transform="translate(145 128)"><g fill="none" stroke="#7ee7ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path class="w" pathLength="1" d="M-22 -24 L-46 0 L-22 24" style="animation-delay:.9s"/><path class="w" pathLength="1" d="M22 -24 L46 0 L22 24" style="animation-delay:.9s"/><path class="w" pathLength="1" d="M10 -34 L-10 34" stroke="#ecebff" style="animation-delay:1.2s"/></g></g>
