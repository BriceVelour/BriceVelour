<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 228" width="880" height="228"><style>
.lum{stroke-dasharray:440 1560;animation:tour 10s linear infinite, vit 10s ease-in-out infinite;animation-delay:-10s}
@keyframes tour{to{stroke-dashoffset:-4000}}
@keyframes vit{0%,100%{opacity:0}3%,30%{opacity:1}36%{opacity:0}}
.res{animation:res 10s ease-in-out infinite;animation-delay:-10s}
@keyframes res{0%,100%{opacity:.7}5%,30%{opacity:1}38%{opacity:.7}}
.logo{filter:drop-shadow(0 0 5px rgba(236,235,255,.35));animation:lg 10s ease-in-out infinite;animation-delay:-10s}
@keyframes lg{0%,100%{opacity:.85}5%,30%{opacity:1}38%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.lum,.res,.logo{animation:none}.lum{opacity:0}}
</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7ee7ff"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#ff5fd0"/></linearGradient><filter id="f" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="880" height="228" fill="#0e1013"/><path d="M14.5 0.5 H879.5 V213.5 L865.5 227.5 H0.5 V14.5 Z" fill="#15181d" stroke="#2a2e37"/><path class="lum" d="M14.5 0.5 H879.5 V213.5 L865.5 227.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="7" filter="url(#f)" opacity=".8"/><path class="lum" d="M14.5 0.5 H879.5 V213.5 L865.5 227.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="2.2"/><text x="44" y="92" fill="#eceaf2" font-family="'Source Serif 4',Georgia,serif" font-size="44" letter-spacing="10">YANNICK BRICE</text><line x1="44" y1="114" x2="224" y2="114" stroke="url(#g)" class="res"/><text x="44" y="146" fill="#a9a7b6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="3">DÉVELOPPEUR EN FORMATION · WEB · MOBILE · MARCHÉS · IA</text><text x="26" y="208" fill="#8a8e9a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">DERNIÈRE ACTIVITÉ · 30.10.2026</text><text x="854" y="208" text-anchor="end" fill="#8a8e9a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">CÉGEP DE SOREL-TRACY · COURS MOBILE 1</text></svg>