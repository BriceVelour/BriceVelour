<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 330" width="290" height="330" role="img" aria-label="02 · VELOUR · LABORATOIRE. Étude des marchés, en privé.">
<defs><clipPath id="c"><path d="M0 0 H272 L290 18 V330 H0 Z"/></clipPath>
<radialGradient id="g" cx="50%" cy="38%" r="55%"><stop offset="0" stop-color="#00e6a0" stop-opacity=".22"/><stop offset="1" stop-color="#00e6a0" stop-opacity="0"/></radialGradient></defs>
<style>@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes souffle{0%,100%{opacity:.55}50%{opacity:1}}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.8s cubic-bezier(.5,0,.2,1) forwards}
.o{opacity:0;animation:monte .9s ease-out forwards}
.b{animation:bat 3s ease-in-out infinite}
.s{animation:souffle 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w,.o,.b,.s,.p{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
.k{font:500 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.nm{font:600 20px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.38em;fill:#ecebff}
.gr{font:600 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.28em;fill:#00e6a0}
.ph{font:italic 400 13px 'Source Serif 4',Georgia,'Times New Roman',serif;fill:#b9b7d0}
</style>
<g clip-path="url(#c)"><rect width="290" height="330" fill="#04050a"/><rect class="s" width="290" height="330" fill="url(#g)"/></g>
<path d="M0.5 0.5 H271.5 L289.5 18.5 V329.5 H0.5 Z" fill="none" stroke="#00e6a0" stroke-opacity=".3"/>
<path class="w" pathLength="1" d="M0.5 0.5 H271.5 L289.5 18.5 V329.5 H0.5 Z" fill="none" stroke="#00e6a0" stroke-opacity=".85" style="animation-delay:0.5s"/>
<text x="22" y="34" class="k o" style="animation-delay:0.7s">02</text><text x="268" y="34" text-anchor="end" class="k o" style="animation-delay:0.7s">PRIVÉ</text>
<g transform="translate(145 128)"><g transform="scale(.82) translate(-75 -55)"><polygon class="w" pathLength="1" points="75,6 120,31 120,79 75,104 30,79 30,31" fill="none" stroke="#4f8cff" stroke-width="3" stroke-linejoin="round" style="animation-delay:.7s"/><path class="w" pathLength="1" d="M52 34 L75 80 L98 34" fill="none" stroke="#ecebff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1s"/><path class="w" pathLength="1" d="M75 80 V96" stroke="#ecebff" stroke-width="5" stroke-linecap="round" style="animation-delay:1.4s"/><circle class="b" cx="75" cy="22" r="4" fill="#3dff9a"/></g></g>
<g class="o" style="animation-delay:1.4s"><text x="145" y="236" text-anchor="middle" class="nm">VELOUR</text>
<text x="145" y="258" text-anchor="middle" class="gr">LABORATOIRE</text>
<text x="145" y="290" text-anchor="middle" class="ph">Étude des marchés, en privé.</text></g>
</svg>
