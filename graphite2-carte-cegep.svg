.logo{filter:drop-shadow(0 0 5px rgba(236,235,255,.35));animation:lg 10s ease-in-out infinite;animation-delay:-4s}
@keyframes lg{0%,100%{opacity:.85}5%,30%{opacity:1}38%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.lum,.res,.logo{animation:none}.lum{opacity:0}}
</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7ee7ff"/><stop offset=".5" stop-color="#ecebff"/><stop offset="1" stop-color="#7ee7ff"/></linearGradient><filter id="f" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="436" height="172" fill="#0e1013"/><path d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" fill="#15181d" stroke="#2a2e37"/><path class="lum" d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="7" filter="url(#f)" opacity=".8"/><path class="lum" d="M14.5 0.5 H435.5 V157.5 L421.5 171.5 H0.5 V14.5 Z" pathLength="2000" fill="none" stroke="url(#g)" stroke-width="2.2"/><text x="26" y="42" fill="#7ee7ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="3" class="res">03</text><text x="26" y="90" fill="#eceaf2" font-family="'Source Serif 4',Georgia,serif" font-size="34" font-weight="600" letter-spacing="5">CÉGEP</text><text x="26" y="122" fill="#a9a7b6" font-family="'Source Serif 4',Georgia,serif" font-size="19" font-style="italic">Mes travaux de cours depuis 2024.</text><text x="410" y="150" text-anchor="end" fill="#7ee7ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">PUBLIC ▸</text><g transform="translate(388 46)"><g class="logo"><g transform="scale(1.3)"><g transform="scale(.5)" fill="none" stroke="#7ee7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 -24 L-46 0 L-22 24"/><path d="M22 -24 L46 0 L22 24"/><path d="M10 -34 L-10 34" stroke="#ecebff"/></g></g></g></g></svg>