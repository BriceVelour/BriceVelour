<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 172" width="436" height="172"><style>
.lum{stroke-dasharray:440 1560;animation:tour 10s linear infinite, vit 10s ease-in-out infinite;animation-delay:-4s}
