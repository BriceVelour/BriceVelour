<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 330" width="290" height="330" role="img" aria-label="01 · REIZA · PROJET PERSONNEL. Une assistante IA, bâtie avec Claude.">
<defs><clipPath id="c"><path d="M0 0 H272 L290 18 V330 H0 Z"/></clipPath>
<radialGradient id="g" cx="50%" cy="38%" r="55%"><stop offset="0" stop-color="#9b6bff" stop-opacity=".22"/><stop offset="1" stop-color="#9b6bff" stop-opacity="0"/></radialGradient></defs>
<style>@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes souffle{0%,100%{opacity:.55}50%{opacity:1}}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.8s cubic-bezier(.5,0,.2,1) forwards}
.o{opacity:0;animation:monte .9s ease-out forwards}
.b{animation:bat 3s ease-in-out infinite}
.s{animation:souffle 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w,.o,.b,.s,.p{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
.k{font:500 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.3em;fill:#8f8da8}
.nm{font:600 20px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.38em;fill:#ecebff}
.gr{font:600 9px ui-monospace,Menlo,'SF Mono',Consolas,'Liberation Mono',monospace;letter-spacing:.28em;fill:#9b6bff}
.ph{font:italic 400 13px 'Source Serif 4',Georgia,'Times New Roman',serif;fill:#b9b7d0}
</style>
<g clip-path="url(#c)"><rect width="290" height="330" fill="#04050a"/><rect class="s" width="290" height="330" fill="url(#g)"/></g>
<path d="M0.5 0.5 H271.5 L289.5 18.5 V329.5 H0.5 Z" fill="none" stroke="#9b6bff" stroke-opacity=".3"/>
<path class="w" pathLength="1" d="M0.5 0.5 H271.5 L289.5 18.5 V329.5 H0.5 Z" fill="none" stroke="#9b6bff" stroke-opacity=".85" style="animation-delay:0.2s"/>
<text x="22" y="34" class="k o" style="animation-delay:0.4s">01</text><text x="268" y="34" text-anchor="end" class="k o" style="animation-delay:0.4s">PRIVÉ</text>
<g transform="translate(145 128)"><g transform="scale(.36) translate(-120 -120)" fill="none" stroke="#9b6bff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path class="w" pathLength="1" d="M79 20 V222" style="animation-delay:.5s"/><path class="w" pathLength="1" d="M79 42 L153 86 L79 130" style="animation-delay:.8s"/><path class="w" pathLength="1" d="M79 130 L161 222" style="animation-delay:1.1s"/><path class="w" pathLength="1" d="M79 42 L121 16" style="animation-delay:1.3s"/></g></g>
<g class="o" style="animation-delay:1.1s"><text x="145" y="236" text-anchor="middle" class="nm">REIZA</text>
<text x="145" y="258" text-anchor="middle" class="gr">PROJET PERSONNEL</text>
<text x="145" y="290" text-anchor="middle" class="ph">Une assistante IA, bâtie avec Claude.</text></g>
